<!DOCTYPE html>
<html lang="pt-br" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Continuar Assistindo | GAMERADO TV</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .cw-page-header { padding: 80px 5% 20px 5%; display: flex; align-items: center; gap: 15px; }
        .back-btn { color: white; font-size: 1.5rem; text-decoration: none; cursor: pointer; }
        .grid-cw { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; padding: 0 5% 40px 5%; }
        
        /* Estilos idênticos aos do index.html para o card de Continuar Assistindo */
        .cw-card { width: 100%; cursor: pointer; position: relative; background: transparent; border: none; }
        .cw-thumb-container { position: relative; width: 100%; height: 160px; border-radius: 6px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .cw-thumb-container img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; }
        .cw-card:hover .cw-thumb-container img { transform: scale(1.05); }
        .cw-progress-bar { position: absolute; bottom: 0; left: 0; width: 100%; height: 4px; background: rgba(255,255,255,0.3); }
        .cw-progress-fill { height: 100%; background: var(--primary-red, #e50914); }
        .cw-remove-btn { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.7); color: white; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; cursor: pointer; z-index: 2; transition: background 0.3s; }
        .cw-remove-btn:hover { background: var(--primary-red, #e50914); }
        .cw-info { padding-top: 10px; text-align: left; }
        .cw-info h4 { font-size: 1rem; margin: 0; color: white; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .cw-info p { font-size: 0.8rem; color: #aaa; margin: 3px 0 0 0; }
        
        .empty-msg { text-align: center; color: #888; width: 100%; padding: 50px 0; grid-column: 1 / -1; }
    </style>
</head>
<body>
    <header class="navbar">
        <h1 class="logo-rgb">GAMERADO TV</h1>
    </header>

    <div class="cw-page-header">
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <h2 class="category-title" style="margin:0;">Continuar Assistindo</h2>
    </div>

    <div class="grid-cw" id="cw-grid-container">
        <!-- Os vídeos parados pela metade aparecerão aqui via JavaScript -->
    </div>

    <script>
        function loadFullContinueWatching() {
            const cwGrid = document.getElementById('cw-grid-container');
            let cwList = JSON.parse(localStorage.getItem('continueWatchingList') || '[]');

            if (cwList.length > 0) {
                cwGrid.innerHTML = '';
                cwList.forEach((item, index) => {
                    const subtitle = item.type === 'serie' ? `EP ${item.season || 1}x${item.episode || 1}` : (item.year || 'Filme');
                    const playerLink = item.playerUrl || `player.html?title=${encodeURIComponent(item.title)}`;
                    
                    const cardHtml = `
                        <div class="cw-card" onclick="window.location.href='${playerLink}'">
                            <div class="cw-remove-btn" onclick="removeCWItem(event, ${index})"><i class="fas fa-times"></i></div>
                            <div class="cw-thumb-container">
                                <img src="${item.cover}" alt="${item.title}">
                                <div class="cw-progress-bar">
                                    <div class="cw-progress-fill" style="width: ${item.progress}%"></div>
                                </div>
                            </div>
                            <div class="cw-info">
                                <h4>${item.title}</h4>
                                <p>${subtitle}</p>
                            </div>
                        </div>
                    `;
                    cwGrid.innerHTML += cardHtml;
                });
            } else {
                cwGrid.innerHTML = '<p class="empty-msg">Nenhum título sendo assistido no momento.</p>';
            }
        }

        function removeCWItem(event, index) {
            event.stopPropagation();
            let cwList = JSON.parse(localStorage.getItem('continueWatchingList') || '[]');
            cwList.splice(index, 1); // Remove o item da lista
            localStorage.setItem('continueWatchingList', JSON.stringify(cwList));
            loadFullContinueWatching();
        }

        document.addEventListener("DOMContentLoaded", loadFullContinueWatching);
    </script>
</body>
</html>
