<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Cadastro | GAMERADOFLIX</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- GOOGLE LOGIN -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- FACEBOOK SDK -->
    <script>
        window.fbAsyncInit = function () {
            FB.init({
                appId: '1374777304818660',
                cookie: true,
                xfbml: false,
                version: 'v23.0'
            });
            FB.AppEvents.logPageView();
        };

        (function (d, s, id) {
            var js, fjs = d.getElementsByTagName(s)[0];
            if (d.getElementById(id)) return;
            js = d.createElement(s); js.id = id;
            js.src = "https://connect.facebook.net/pt_BR/sdk.js";
            fjs.parentNode.insertBefore(js, fjs);
        }(document, 'script', 'facebook-jssdk'));
    </script>
    
    <style>
        :root { --dark: #040D12; --red: #C63C51; --light: #f3f3f3; }
        * { box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(rgba(4, 13, 18, 0.85), rgba(4, 13, 18, 0.85)), url('https://image.tmdb.org/t/p/original/mDeUmG9ca0p2uY686p799986as3.jpg');
            background-size: cover; background-position: center;
            min-height: 100vh; display: flex; justify-content: center; align-items: center; margin: 0; padding: 20px;
        }
        .auth-card {
            background: rgba(4, 13, 18, 0.95);
            padding: 40px; border-radius: 15px; width: 100%; max-width: 500px;
            text-align: center; border-top: 4px solid var(--red);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        h2 { color: var(--light); margin-bottom: 25px; font-weight: 700; }
        .input-box { margin-bottom: 20px; text-align: left; position: relative; }
        .input-box label { color: var(--light); font-size: 0.8rem; display: block; margin-bottom: 8px; }
        .input-box input {
            width: 100%; padding: 12px; border-radius: 5px; border: 1px solid #333;
            background: #111; color: white; outline: none; box-sizing: border-box;
        }
        .input-box input:focus { border-color: var(--red); }
        
        .toggle-password {
            position: absolute; right: 12px; top: 38px; color: #888;
            cursor: pointer; font-size: 1.1rem; transition: 0.3s;
        }
        .toggle-password:hover { color: var(--light); }

        .error-msg {
            color: #ff4d4d; font-size: 0.85rem; margin-top: -10px; margin-bottom: 15px;
            display: none; text-align: left; font-weight: bold;
        }

        .btn-submit {
            width: 100%; padding: 14px; background: var(--red); border: none;
            color: white; font-weight: bold; border-radius: 5px; cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        .btn-submit:hover { background: #a32f41; }
        
        .guest-link { display: block; margin-top: 20px; color: #aaa; text-decoration: none; font-size: 0.9rem; cursor: pointer; }
        .guest-link:hover { color: var(--light); text-decoration: underline; }
        .switch-form { margin-top: 20px; color: #888; font-size: 0.85rem; }
        .switch-form span { color: var(--red); cursor: pointer; font-weight: bold; }
        
        .divider { display: flex; align-items: center; text-align: center; margin: 20px 0; color: #888; font-size: 0.9rem; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #333; }
        .divider:not(:empty)::before { margin-right: 10px; }
        .divider:not(:empty)::after { margin-left: 10px; }
        
        /* BOTÕES SOCIAIS */
        .social-buttons { display: flex; flex-direction: column; gap: 12px; width: 100%; align-items: center; }
        
        /* GOOGLE */
        .google-btn-container { display: flex; justify-content: center; width: 100%; }
        
        /* FACEBOOK */
        #facebookLoginBtn {
            width: 100%; max-width: 300px; height: 40px; 
            border: none; border-radius: 4px; background: #1877F2;
            color: white; font-family: 'Roboto', Arial, sans-serif; font-size: 14px; font-weight: 500;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            gap: 12px; transition: 0.2s; padding: 0; box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.2);
        }
        #facebookLoginBtn:hover { background: #166fe5; }
        #facebookLoginBtn:active { transform: scale(0.99); }
        .facebook-icon {
            width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
            font-family: Arial, sans-serif; font-size: 22px; font-weight: bold; line-height: 1;
        }
        .loading { opacity: 0.7; pointer-events: none; }

        /* AJUSTES PARA DISPOSITIVOS MÓVEIS */
        @media (max-width: 600px) {
            body { 
                align-items: flex-start;
                padding: 20px 15px; 
            }
            .auth-card { 
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <h2 id="formTitle">Entrar</h2>
        
        <!-- FORMULÁRIO -->
        <form id="authForm">
            <div class="input-box" id="nameField" style="display: none;">
                <label>Nome Completo</label>
                <input type="text" id="userName" placeholder="Seu nome">
            </div>
            <div class="input-box">
                <label>E-mail</label>
                <input type="email" id="userEmail" placeholder="email@exemplo.com" required>
            </div>
            <div class="input-box">
                <label>Senha</label>
                <input type="password" id="userPass" placeholder="••••••••" required>
                <i class="fas fa-eye toggle-password" id="eyeIcon" onclick="togglePasswordVisibility()"></i>
            </div>
            
            <p id="errorMsg" class="error-msg">Login ou senha incorreto.</p>

            <button type="submit" class="btn-submit" id="btnText">Entrar</button>
        </form>
        
        <div class="divider">ou</div>

        <!-- BOTÕES SOCIAIS -->
        <div class="social-buttons">
            <!-- GOOGLE -->
            <div id="g_id_onload"
                 data-client_id="892335542975-ups3qufrrvkiduj91vrccetle6orl9ib.apps.googleusercontent.com"
                 data-context="signin" data-ux_mode="popup"
                 data-callback="handleCredentialResponse" data-auto_prompt="false">
            </div>
            <div class="google-btn-container">
                <div class="g_id_signin" 
                     data-type="standard" 
                     data-shape="rectangular" 
                     data-theme="outline" 
                     data-text="signin_with" 
                     data-size="large" 
                     data-logo_alignment="center" 
                     data-width="300">
                </div>
            </div>

            <!-- FACEBOOK -->
            <button type="button" id="facebookLoginBtn" onclick="loginComFacebook()">
                <span class="facebook-icon">f</span>
                <span>Fazer login com o Facebook</span>
            </button>
        </div>
        
        <a onclick="entrarComoConvidado()" class="guest-link">Entrar como Convidado</a>
        
        <p class="switch-form" id="switchText">Novo no GAMERADOFLIX? <span onclick="toggleForm()">Cadastre-se agora.</span></p>
    </div>

    <!-- Scripts do Firebase e Lógica de Autenticação -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            createUserWithEmailAndPassword, 
            signInWithEmailAndPassword 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            setDoc, 
            getDoc 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBDAEceAHyKzSTEJazFgJkWhtL1QxXYBlc",
            authDomain: "gameradotv.firebaseapp.com",
            projectId: "gameradotv",
            storageBucket: "gameradotv.firebasestorage.app",
            messagingSenderId: "720542060460",
            appId: "1:720542060460:web:11c44c4efee5743491f409"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        window.isLogin = true;

        // SALVAR DADOS DO FACEBOOK NO FIRESTORE
        window.salvarNoBancoFacebook = async function(user) {
            try {
                const docId = 'facebook_' + user.id;
                const userData = {
                    email: user.email || '',
                    name: user.name || 'Usuário Facebook',
                    handle: (user.name || 'user').toLowerCase().replace(/\s+/g, '_') + Math.floor(100 + Math.random() * 900),
                    pontos: 0,
                    joinTimestamp: Date.now(),
                    avatar: user.picture && user.picture.data ? user.picture.data.url : '',
                    banner: '',
                    provedor: 'facebook',
                    configuracoes: {
                        notif: true, autoplay: false, lang: 'pt-br', theme: 'deep-dark',
                        fontSize: 'medium', private: false, showJoin: true, comments: true,
                        filter: true, ranking: true, quality: 'auto'
                    }
                };

                await setDoc(doc(db, "users", docId), userData, { merge: true });

                localStorage.setItem('gameradoflix_currentUserEmail', userData.email);
                localStorage.setItem('selectedUser', JSON.stringify(userData));
                localStorage.setItem('appSettings', JSON.stringify(userData.configuracoes));
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('gameradoflix_isGuest', 'false');

                window.location.href = 'conta.html';
            } catch (error) {
                console.error("Erro ao salvar Facebook no Firebase:", error);
                alert("Erro ao conectar no banco de dados. Tente novamente.");
                if (typeof restaurarBotaoFacebook === 'function') restaurarBotaoFacebook();
            }
        };

        // Gestão do Formulário de Login/Registo (Email e Senha)
        document.getElementById('authForm').addEventListener('submit', async function(e) {
            e.preventDefault(); 
            
            const email = document.getElementById('userEmail').value;
            const senha = document.getElementById('userPass').value;
            const nome = document.getElementById('userName').value;
            const errorMsg = document.getElementById('errorMsg');
            const btnSubmit = document.getElementById('btnText');
            
            errorMsg.style.display = 'none';
            btnSubmit.innerText = 'Aguarde...';
            btnSubmit.disabled = true;

            try {
                if (!window.isLogin) {
                    const userCredential = await createUserWithEmailAndPassword(auth, email, senha);
                    const user = userCredential.user;

                    const userData = {
                        email: email, name: nome,
                        handle: nome.toLowerCase().replace(/\s+/g, '_') + Math.floor(100 + Math.random() * 900),
                        pontos: 0, joinTimestamp: Date.now(), avatar: '', banner: '',
                        configuracoes: {
                            notif: true, autoplay: false, lang: 'pt-br', theme: 'deep-dark',
                            fontSize: 'medium', private: false, showJoin: true, comments: true,
                            filter: true, ranking: true, quality: 'auto'
                        }
                    };

                    await setDoc(doc(db, "users", user.uid), userData);

                    localStorage.setItem('gameradoflix_currentUserEmail', userData.email);
                    localStorage.setItem('selectedUser', JSON.stringify(userData));
                    localStorage.setItem('appSettings', JSON.stringify(userData.configuracoes));
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('gameradoflix_isGuest', 'false');
                    
                    window.location.href = 'conta.html';

                } else {
                    const userCredential = await signInWithEmailAndPassword(auth, email, senha);
                    const user = userCredential.user;
                    const userDoc = await getDoc(doc(db, "users", user.uid));

                    if (userDoc.exists()) {
                        const userData = userDoc.data();
                        
                        localStorage.setItem('gameradoflix_currentUserEmail', userData.email);
                        localStorage.setItem('selectedUser', JSON.stringify(userData));
                        localStorage.setItem('appSettings', JSON.stringify(userData.configuracoes));
                        localStorage.setItem('isLoggedIn', 'true');
                        localStorage.setItem('gameradoflix_isGuest', 'false');
                        
                        window.location.href = 'conta.html';
                    } else {
                        errorMsg.innerText = "Dados do utilizador não encontrados.";
                        errorMsg.style.display = 'block';
                        btnSubmit.innerText = 'Entrar';
                        btnSubmit.disabled = false;
                    }
                }
            } catch (error) {
                console.error("Erro:", error);
                if (error.code === 'auth/email-already-in-use') {
                    errorMsg.innerText = "E-mail já está em uso.";
                } else if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
                    errorMsg.innerText = "E-mail ou senha incorretos.";
                } else if (error.code === 'auth/weak-password') {
                    errorMsg.innerText = "A senha deve ter no mínimo 6 caracteres.";
                } else {
                    errorMsg.innerText = "Erro ao conectar. Tente novamente.";
                }
                errorMsg.style.display = 'block';
                btnSubmit.innerText = window.isLogin ? 'Entrar' : 'Criar Conta';
                btnSubmit.disabled = false;
            }
        });
    </script>

    <!-- LÓGICA DO FACEBOOK LOGIN E UI GERAL -->
    <script>
        window.loginComFacebook = function () {
            const btn = document.getElementById('facebookLoginBtn');

            if (typeof FB === 'undefined') {
                alert('O Facebook ainda está carregando. Aguarde alguns segundos e tente novamente.');
                return;
            }

            btn.classList.add('loading');
            btn.innerHTML = '<span>Entrando com Facebook...</span>';

            FB.login(function (response) {
                if (response.authResponse) {
                    FB.api('/me', { fields: 'id,name,email,picture.type(large)' }, function (user) {
                        if (!user || user.error) {
                            restaurarBotaoFacebook();
                            alert('Não foi possível obter os dados da sua conta do Facebook.');
                            return;
                        }

                        if (typeof window.salvarNoBancoFacebook === 'function') {
                            window.salvarNoBancoFacebook(user);
                        } else {
                            restaurarBotaoFacebook();
                            alert('Erro ao conectar ao banco de dados do sistema.');
                        }
                    });
                } else {
                    restaurarBotaoFacebook();
                }
            }, { scope: 'public_profile,email' });
        };

        function restaurarBotaoFacebook() {
            const btn = document.getElementById('facebookLoginBtn');
            btn.classList.remove('loading');
            btn.innerHTML = `
                <span class="facebook-icon">f</span>
                <span>Fazer login com o Facebook</span>
            `;
        }

        function toggleForm() {
            const title = document.getElementById('formTitle');
            const btn = document.getElementById('btnText');
            const nameField = document.getElementById('nameField');
            const switchText = document.getElementById('switchText');
            const nameInput = document.getElementById('userName');
            const errorMsg = document.getElementById('errorMsg');

            window.isLogin = !window.isLogin;
            errorMsg.style.display = 'none';

            if (!window.isLogin) {
                title.innerText = 'Cadastrar';
                btn.innerText = 'Criar Conta';
                nameField.style.display = 'block';
                nameInput.required = true;
                switchText.innerHTML = 'Já tem uma conta? <span onclick="toggleForm()">Faça login.</span>';
            } else {
                title.innerText = 'Entrar';
                btn.innerText = 'Entrar';
                nameField.style.display = 'none';
                nameInput.required = false;
                switchText.innerHTML = 'Novo no GAMERADOFLIX? <span onclick="toggleForm()">Cadastre-se agora.</span>';
            }
        }

        function togglePasswordVisibility() {
            const passInput = document.getElementById('userPass');
            const eyeIcon = document.getElementById('eyeIcon');
            
            if (passInput.type === 'password') {
                passInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }

        function entrarComoConvidado() {
            localStorage.setItem('gameradoflix_isGuest', 'true');
            window.location.href = 'conta.html';
        }
    </script>
</body>
</html>
